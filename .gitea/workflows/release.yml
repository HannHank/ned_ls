name: Build and release binaries

# on:
#   push:
#     tags:
#       - 'v*'  # Trigger when pushing tag like v1.0.0 → git tag v0.1.0 && git push origin v0.1.0
#

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: rustup component add clippy
      - run: cargo clippy -- -D warnings

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo test --all
  
  build:
    name: Build cross-platform binaries
    runs-on: ubuntu-latest
    needs: [fmt, clippy, tests]

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          override: true

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libssl-dev zlib1g-dev
          sudo apt install -y mingw-w64       
          sudo apt install -y musl-tools      

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary for upload
        run: |
          # Simple step to copy the built binary to artifacts -> might needs adjustment later 
          mkdir -p artifacts
          BIN_NAME="ned_ls"
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          fi

          # This is the name later used in the exteions.ts
          cp target/${{ matrix.target }}/release/${BIN_NAME}${EXT} artifacts/${BIN_NAME}-${{ matrix.target }}${EXT}

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/

  build-client:
    name: Build VSCode extension
    runs-on: ubuntu-latest
    needs: [build] 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'editors/code/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./editors/code
        run: pnpm install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v3
        with:
          path: temp-binaries

      - name: Move binaries to bin folder
        run: |
          mkdir -p editors/code/bin
          find temp-binaries -type f -name "ned_ls-*" -exec cp {} editors/code/bin/ \;
          chmod +x editors/code/bin/* || true
          ls -la editors/code/bin/ 

      - name: Build extension
        working-directory: ./editors/code
        run: pnpm run compile -- --production

      - name: Package extension
        working-directory: ./editors/code
        run: pnpm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ned-language-server.vsix
          path: editors/code/*.vsix
